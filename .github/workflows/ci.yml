name: CI

# Contrôle qualité : lint, formatage, tests backend et build frontend.
# Rien n'est déployé ici — ce workflow atteste que le code tient debout.

on:
  push:
    branches: [main, career-proof]
  pull_request:
    branches: [main, career-proof]
  # Relance manuelle : indispensable quand un run échoue pour une raison
  # extérieure au code (quota GitHub Actions, panne d'un service).
  workflow_dispatch:

# Une seule exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint et tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devis_btp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # WeasyPrint est une bibliothèque native : sans Pango et HarfBuzz, son
      # import échoue et TOUS les tests d'API tombent, pas seulement ceux du PDF.
      - name: Dépendances système de WeasyPrint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev

      - name: Installation
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Formatage
        working-directory: backend
        run: ruff format --check app tests

      - name: Tests
        working-directory: backend
        env:
          # Base dédiée : le schéma y est créé puis jeté, jamais celle de dev.
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/devis_btp_test
          # Valeur factice : le validateur exige 32 caractères hors placeholders.
          SECRET_KEY: ci-secret-key-not-used-in-production-32chars
          # Aucun appel réel au fournisseur : les tests remplacent le client.
          LLM_API_KEY: ci-key-not-used
        run: pytest -q

  frontend:
    name: Frontend — build et tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --frozen-lockfile équivalent : échoue si le lockfile ne correspond pas
      # aux manifestes, plutôt que de résoudre silencieusement d'autres versions.
      - name: Installation
        working-directory: frontend
        run: npm ci

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build de production
        working-directory: frontend
        run: npm run build
